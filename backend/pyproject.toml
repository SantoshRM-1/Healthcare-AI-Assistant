[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medassist-ai-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3", "email-validator>=2,<3", "PyJWT[crypto]>=2.9,<3", "httpx>=0.27,<1", "python-multipart>=0.0.20,<1", "cloudinary>=1.44,<2", "PyMuPDF>=1.25,<2", "Pillow>=11,<13", "numpy>=1.24,<2", "paddleocr>=3.0,<4", "paddlepaddle>=3.0,<4", "google-genai>=1.30,<2", "langgraph>=0.6,<2", "chromadb>=1.0,<2", "faster-whisper>=1.1,<2", "reportlab>=4.2,<5"]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
